<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="{{url_for('static',filename='styles.css')}}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>
    {%include 'navbar.html' %}
    <div class="app">

        <!-- =========================
         MAIN
    ========================== -->

        <main class="main">


            <!-- HEADER -->

            <header class="top-header">

                <div class="page-title">

                    <h1>
                        Billing & Payment
                    </h1>

                    <p>
                        Manage your payment
                    </p>

                </div>

            </header>

            <section class="order-section">

                <div class="order-header">

                    <h2>
                        Customer Bills
                    </h2>

                    <button class="new-order-btn" onclick="openBillingModal()">
                        + Record Payment
                    </button>

                </div>


                <!-- SEARCH -->

                <div class="filter-area">

                    <div class="search-box">

                        <span>
                            <i class="fa-solid fa-magnifying-glass"></i>
                        </span>

                        <input type="text" id="billingSearch" placeholder="Search customer or bill..."
                            oninput="renderBilling()">

                    </div>

                </div>


                <!-- BILLING TABLE -->

                <div class="table-container">

                    <table>

                        <thead>

                            <tr>

                                <th>
                                    BILL
                                </th>

                                <th>
                                    CUSTOMER
                                </th>

                                <th>
                                    ORDER
                                </th>

                                <th>
                                    TOTAL
                                </th>

                                <th>
                                    PAID
                                </th>

                                <th>
                                    BALANCE
                                </th>

                                <th>
                                    STATUS
                                </th>

                                <th>
                                    ACTION
                                </th>

                            </tr>

                        </thead>


                        <tbody id="billingTableBody">

                        </tbody>

                    </table>

                </div>

            </section>



        </main>
    </div>


    <div class="modal-overlay" id="GModal">

        <div class="modal" id="billingModal">

            <div class="modal-header">

                <h2 id="modalTitle">
                    New Bill
                </h2>

                <button class="close-btn" onclick="closeModal()">
                    ×
                </button>

            </div>


            <form id="billingForm">

                <!-- CUSTOMER -->

                <div class="form-group">

                    <label>
                        Customer Name
                    </label>

                    <input type="text" id="billingCustomer" placeholder="Customer" readonly>

                </div>


                <!-- ORDER ID -->

                <div class="form-group">

                    <label>
                        Order ID
                    </label>

                    <select id="billingOrder" required onchange="syncBillingOrder()">
                        <option value="">Select order</option>
                        {% for order in orders %}<option value="{{ order.id }}">#{{ order.id }} · {{ order.customer }} ({{ order.balance }})</option>{% endfor %}
                    </select>

                </div>


                <!-- TOTAL AMOUNT -->

                <div class="form-group">

                    <label>
                        Total Amount
                    </label>

                    <input type="number" id="billingAmount" placeholder="Order total" readonly>

                </div>


                <!-- PAID AMOUNT -->

                <div class="form-group">

                    <label>
                        Paid Amount
                    </label>

                    <input type="number" id="paidAmount" placeholder="Amount received now" min="0.01" step="0.01" required>

                </div>


                <!-- PAYMENT METHOD -->

                <div class="form-group">

                    <label>
                        Payment Method
                    </label>

                    <select id="paymentMethod" required>

                        <option value="">
                            Select payment method
                        </option>

                        <option value="Cash">
                            Cash
                        </option>

                        <option value="UPI">
                            UPI
                        </option>

                        <option value="Card">
                            Card
                        </option>

                    </select>

                </div>


                <button type="submit" class="save-btn">
                    Save Bill
                </button>

            </form>

        </div>

    </div>
    <script>window.dbOrders = {{ orders | tojson }};</script>
    <script src="{{url_for('static',filename='script.js')}}"></script>
</body>

</html>
